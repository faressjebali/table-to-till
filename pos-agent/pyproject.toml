[project]
name = "pos-agent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["logs"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, B bugbear, UP pyupgrade, SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "single"
