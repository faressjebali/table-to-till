# Vérifications de chaque PR : lint, formatage, types et tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coffee_qr
          TZ: Africa/Tunis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee -d coffee_qr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://coffee:ci@localhost:5432/coffee_qr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # ESLint a besoin des dépendances de chaque projet pour lire les types.
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: customer-web
      - run: npm ci
        working-directory: staff-app
      - run: npm run lint
      - run: npm run format:check
      - name: Scripts (vérification de .env)
        run: npm run test:scripts
      - name: Serveur (types et tests)
        working-directory: server
        run: npm run typecheck && npm test
      - name: Menu QR (types, tests et build)
        working-directory: customer-web
        run: npm run typecheck && npm test && npm run build
      - name: App staff (types, tests et build)
        working-directory: staff-app
        run: npm run typecheck && npm test && npm run build

  # l'application par UI Automation et comparent son arbre aux relevés de la caisse.
  emulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Émulateur (build et tests)
        working-directory: pos-emulator
        run: dotnet test LegacyEmulator.sln -nologo

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
